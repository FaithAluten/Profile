# 运行模式
mode: rule
# 日志级别
log-level: info
# IPv6
ipv6: true
# 进程匹配模式
find-process-mode: strict
# 缓存
profile:
  store-selected: true
  store-fake-ip: true
# 统一延迟
unified-delay: false
# TCP 并发
tcp-concurrent: true
# GEOIP 数据模式
geodata-mode: false
# GEO 文件加载模式
geodata-loader: standard
# 自动更新 GEO
geo-auto-update: true
geo-update-interval: 24
# 自定义 GEO 下载地址
geox-url:
  # geoip: 'https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geoip.dat'
  # geosite: 'https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geosite.dat'
  mmdb: 'https://geodata.kelee.one/Country-Masaiki.mmdb'
  asn: 'https://geodata.kelee.one/GeoLite2-ASN-P3TERX.mmdb'


# DNS
dns:
  enable: true
  prefer-h3: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

# 域名嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com
  skip-domain:
    - Mijia Cloud

# 代理端口
port: 7890
socks-port: 7891
mixed-port: 7892

# TUN
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true

proxies:

proxy-groups:
  - { name: "$app_name", type: select, proxies: [] }


## 路由规则
rules:
  - GEOIP,CN,DIRECT
  - MATCH,$app_name
