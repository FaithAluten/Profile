    - 223.5.5.5
    - 119.29.29.29

# 域名嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com
  skip-domain:
    - Mijia Cloud

# 代理端口
port: 7890
socks-port: 7891
mixed-port: 7892

# TUN
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true

proxies:

proxy-groups:
  - { name: "$app_name", type: select, proxies: [] }


